        <form action="../controller/auntentif_login.php" method="POST">
        <h1>Bienvenido a Meerkast</h1>
 
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username">
 
        <div class="password-container">
            <label for="password">Contraseña</label>
            <input type="password" id="txtpassword" name="password">
            <input type="button" class="boton1" onclick="handdlerPassword()" value="Ver">
        </div>
     
        <input type="submit" class="boton" name="Iniciar" value="Iniciar">
           
        <div class="recuperar">

        </div>
    </form>




   


    <!-- </form>-->
    <script>
        const txtPassword = document.getElementById('txtpassword');
 
        function handdlerPassword(){
            if (txtPassword.type === 'password'){
                txtPassword.type = 'text';
            }else{
                txtPassword.type = 'password';
            }
        }
    </script>
